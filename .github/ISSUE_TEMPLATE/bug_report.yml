name: Bug report
description: Report something that is broken or confusing.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Thanks for helping improve SecureAuth Admin."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Tell us what you expected and what actually happened.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open...\n2. Submit...\n3. See..."
    validations:
      required: true
  - type: input
    id: php-version
    attributes:
      label: PHP version
      placeholder: "Example: PHP 8.2"
  - type: input
    id: database
    attributes:
      label: Database
      placeholder: "Example: MySQL 8.0 or MariaDB 10.5"
  - type: textarea
    id: notes
    attributes:
      label: Extra notes
      description: Do not paste secrets, passwords, OTPs, or `.env` values.
