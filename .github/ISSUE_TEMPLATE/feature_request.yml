name: Feature request
description: Suggest an improvement for SecureAuth Admin.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security impact
      description: Does this affect login, sessions, CSRF, OTP, database access, logs, or file access?
